<!DOCTYPE html>
<style>
body{background:#1E1F22;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);overflow:hidden}
canvas{outline:none;border:.3px solid #9E9994;background:#BFB9B7;height:432px;width:270px;border-radius:8px 8px 8px 32px;box-shadow:5px 5px rgba(156,154,154,.84)}
.box{width:20px;height:20px;background:#9BBC0F;cursor:pointer}
.box:hover{background:#9cbc0f7c}
#g{z-index:2;position:absolute;top:0;left:0;margin-left:66px;margin-top:69px;width:140px;height:125px;display:flex;flex-wrap:wrap;align-content:flex-start;box-sizing:border-box;overflow:hidden}
</style>
<div id="g"></div>
<canvas></canvas>
<script>
for(let i=0;i<42;i++){let b=document.createElement('div');b.className='box';g.appendChild(b);}
const c=document.querySelector('canvas').getContext('2d'),
l=[[0,10,300,10,1,'#9E9994'],[30,0,30,10,4,'#9E9994'],[270,0,270,10,4,'#9E9994']];
l.forEach(x=>{c.beginPath();c.lineWidth=x[4];c.strokeStyle=x[5];c.moveTo(x[0],x[1]);c.lineTo(x[2],x[3]);c.stroke();});
c.lineWidth=1;c.strokeStyle='#545460';c.fillStyle='#545460';c.beginPath();c.roundRect(30,20,240,50,[4,4,20,4]);c.fill();c.stroke();
[[30,90,75,8,3,'#0D0B19'],[53,82,30,23,3,'#0D0B19']].forEach(r=>{c.beginPath();c.strokeStyle=r[5];c.fillStyle=r[5];c.roundRect(r[0],r[1],r[2],r[3],r[4]);c.fill();c.stroke();});
[[215,100,17,5,'#88285A'],[260,90,17,5,'#88285A']].forEach(e=>{c.beginPath();c.fillStyle=e[4];c.ellipse(e[0],e[1],e[2],e[3],0,0,6.28);c.stroke();c.fill();});
c.beginPath();c.strokeStyle='#8B9F5A';c.fillStyle='#8B9F5A';c.roundRect(75,25,150,40,0);c.fill();c.stroke();
[[100,125,135,119,5,'#8B8989'],[150,125,185,119,5,'#8B8989'],[212,133,243,148,2,'#8B7E6C'],[221,131,252,146,2,'#8B7E6C'],[232,130,263,145,2,'#8B7E6C'],[244,128,275,143,2,'#8B7E6C'],[255,127,286,142,2,'#8B7E6C'],[265,125,296,140,2,'#8B7E6C']].forEach(m=>{c.beginPath();c.lineWidth=m[4];c.strokeStyle=m[5];c.fillStyle=m[5];c.lineCap='round';c.moveTo(m[0],m[1]);c.lineTo(m[2],m[3]);c.fill();c.stroke();});
const cl=['#8bac0f','#306230','#0f380f','#9BBC0F'];
document.querySelectorAll('.box').forEach(b=>{let i=0;b.addEventListener('click',()=>{b.style.backgroundColor=cl[i];i=(i+1)%cl.length;});});
</script>
